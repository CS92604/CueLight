name: Delete old releases

# One-off clean-up, run by hand: deletes the releases named below together with their tags.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated release tags to delete, e.g. v0.1.0 v0.1.1'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in $TAGS; do
            echo "Deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes || echo "Could not delete $tag"
          done
          echo "Releases left:"
          gh release list
