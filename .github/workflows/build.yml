name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test ClaudeLiveAssistant.sln -c Release

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/Assistant.App -c Release -r win-x64 --self-contained -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath ClaudeLiveAssistant-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeLiveAssistant-win-x64
          path: ClaudeLiveAssistant-win-x64.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ClaudeLiveAssistant-win-x64.zip --clobber
