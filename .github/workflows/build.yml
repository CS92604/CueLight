name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, e.g. v0.2.0 (leave empty to only build)'
        required: false
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test ClaudeLiveAssistant.sln -c Release

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The same tests again on Windows itself (the first job runs them on Linux).
      - name: Test on Windows
        shell: pwsh
        run: dotnet test ClaudeLiveAssistant.sln -c Release

      - name: Work out the tag and version
        id: ver
        shell: pwsh
        run: |
          $tag = ''
          if ($env:GITHUB_EVENT_NAME -eq 'release') { $tag = $env:RELEASE_EVENT_TAG }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = $env:INPUT_TAG }
          $version = '0.0.0'
          if ($tag -match '^v?(\d+\.\d+\.\d+)') { $version = $Matches[1] }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "tag='$tag' version=$version"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Assistant.App -c Release -r win-x64 --self-contained `
            -p:Version=${{ steps.ver.outputs.version }} -o ClaudeLiveAssistant
          Remove-Item ClaudeLiveAssistant\*.pdb -ErrorAction SilentlyContinue
          Copy-Item packaging\README.txt ClaudeLiveAssistant\README.txt

      # The speech engine's native libraries need the Visual C++ runtime, which a clean Windows PC
      # may not have. Ship it next to the exe ("app-local deployment", allowed by Microsoft).
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $root = Join-Path $vs 'VC\Redist\MSVC'
          $ver = Get-ChildItem $root -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $ver) { throw "No Visual C++ redistributable found under $root" }
          Write-Host "Using $($ver.FullName)"
          $x64 = Join-Path $ver.FullName 'x64'
          foreach ($pattern in 'Microsoft.VC*.CRT', 'Microsoft.VC*.OpenMP') {
            $dir = Get-ChildItem $x64 -Directory | Where-Object Name -like $pattern | Select-Object -First 1
            if (-not $dir) { throw "Missing $pattern under $x64" }
            Copy-Item (Join-Path $dir.FullName '*.dll') ClaudeLiveAssistant\ -Force
          }
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'vcomp140.dll') {
            if (-not (Test-Path "ClaudeLiveAssistant\$dll")) { throw "$dll was not bundled" }
          }

      - name: Check that nothing is missing on a clean PC
        shell: pwsh
        run: python packaging\check-deps.py ClaudeLiveAssistant

      # Real-Windows checks of the things that differ between PCs (see src/Assistant.App/SelfTest.cs):
      # the speech engine's native libraries, real speech into text, drawing the windows, hiding them
      # from screen capture. Runs the engine twice: normally, and as a CPU without AVX2 would.
      - name: Record some speech with Windows' own voice
        shell: powershell
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$PWD\selftest.wav")
          $voice.Speak('Can you start on Monday morning please')
          $voice.Dispose()

      - uses: actions/cache@v4
        with:
          path: selftest-models
          key: whisper-tiny-en-v1

      - name: Self-test
        shell: pwsh
        run: |
          $failed = $false
          foreach ($mode in 'avx2', 'noavx') {
            $arguments = @('--self-test', '--out', "$PWD\selftest-$mode", '--models', "$PWD\selftest-models")
            if (Test-Path selftest.wav) { $arguments += @('--wav', "$PWD\selftest.wav", '--expect', 'monday') }
            if ($mode -eq 'noavx') { $arguments += '--noavx' }
            $p = Start-Process ClaudeLiveAssistant\ClaudeLiveAssistant.exe -ArgumentList $arguments -Wait -PassThru
            Write-Host "===== self-test ($mode), exit code $($p.ExitCode) ====="
            if (Test-Path "selftest-$mode\self-test.txt") { Get-Content "selftest-$mode\self-test.txt" } else { Write-Host 'no report was written' }
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'The self-test failed' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test
          path: |
            selftest-avx2
            selftest-noavx
            selftest.wav

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ClaudeLiveAssistant -DestinationPath ClaudeLiveAssistant-win-x64.zip
          $hash = (Get-FileHash ClaudeLiveAssistant-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ClaudeLiveAssistant-win-x64.zip" | Out-File ClaudeLiveAssistant-win-x64.zip.sha256 -Encoding ascii
          Get-Item ClaudeLiveAssistant-win-x64.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeLiveAssistant-win-x64
          path: |
            ClaudeLiveAssistant-win-x64.zip
            ClaudeLiveAssistant-win-x64.zip.sha256

      - name: Attach to the release
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $files = @('ClaudeLiveAssistant-win-x64.zip', 'ClaudeLiveAssistant-win-x64.zip.sha256')
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            @'
          **Windows (64-bit):** download `ClaudeLiveAssistant-win-x64.zip`, unzip it, and run `ClaudeLiveAssistant.exe`.
          Nothing to install. Paste your Claude API key on first launch; that is the only setup.

          The zip is self-contained (no .NET install needed). Windows may show "Windows protected your PC" because the
          app isn't code-signed yet: choose **More info → Run anyway**. The `.sha256` file lets you check the download.
          '@ | Out-File notes.md -Encoding utf8
            gh release create $env:TAG @files --title "Claude Live Assistant $env:TAG" --notes-file notes.md --generate-notes --target $env:GITHUB_SHA
          }
