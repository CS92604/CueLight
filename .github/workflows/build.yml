name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, e.g. v0.2.0 (leave empty to only build)'
        required: false
      delete_tags:
        description: 'TEMPORARY clean-up: space-separated release tags to delete (with their tags); builds nothing'
        required: false
  release:
    types: [published]

jobs:
  cleanup:
    if: ${{ inputs.delete_tags != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.delete_tags }}
        run: |
          for tag in $TAGS; do
            echo "Deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes || echo "Could not delete $tag"
          done
          echo "Releases left:"
          gh release list

  test:
    if: ${{ inputs.delete_tags == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Cuelight.sln -c Release

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The same tests again on Windows itself (the first job runs them on Linux).
      - name: Test on Windows
        shell: pwsh
        run: dotnet test Cuelight.sln -c Release

      - name: Work out the tag and version
        id: ver
        shell: pwsh
        run: |
          $tag = ''
          if ($env:GITHUB_EVENT_NAME -eq 'release') { $tag = $env:RELEASE_EVENT_TAG }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = $env:INPUT_TAG }
          $version = '0.0.0'
          if ($tag -match '^v?(\d+\.\d+\.\d+)') { $version = $Matches[1] }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "tag='$tag' version=$version"

      # The speech engine's native libraries need the Visual C++ runtime, which a clean Windows PC may
      # not have. Gather the four files they import; they are built INTO the exe (see SpeechRuntime.cs),
      # so nothing needs installing and nothing ships beside it.
      - name: Gather the Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $root = Join-Path $vs 'VC\Redist\MSVC'
          $ver = Get-ChildItem $root -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $ver) { throw "No Visual C++ redistributable found under $root" }
          Write-Host "Using $($ver.FullName)"
          $x64 = Join-Path $ver.FullName 'x64'
          New-Item vc-runtime -ItemType Directory | Out-Null
          foreach ($pattern in 'Microsoft.VC*.CRT', 'Microsoft.VC*.OpenMP') {
            $dir = Get-ChildItem $x64 -Directory | Where-Object Name -like $pattern | Select-Object -First 1
            if (-not $dir) { throw "Missing $pattern under $x64" }
            foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'vcomp140.dll') {
              $file = Join-Path $dir.FullName $dll
              if (Test-Path $file) { Copy-Item $file vc-runtime\ -Force }
            }
          }
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'vcomp140.dll') {
            if (-not (Test-Path "vc-runtime\$dll")) { throw "$dll was not found" }
          }
          Get-ChildItem vc-runtime | Format-Table Name, Length

      # One file: the exe, with the .NET runtime and every library inside (settings are in the csproj).
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Cuelight.App -c Release -r win-x64 `
            -p:Version=${{ steps.ver.outputs.version }} -p:VcRuntimeDir="$PWD\vc-runtime" -o publish
          $files = @(Get-ChildItem publish -Recurse -File)
          $files | Format-Table Name, Length
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Cuelight.exe') {
            throw "The publish folder must hold exactly one file, Cuelight.exe, but has: $($files.Name -join ', ')"
          }

      # What gets unpacked at run time must not need anything a clean PC lacks. Checked below, after the
      # self-test has unpacked it, by reading the import tables of every native library.

      # Real-Windows checks of the things that differ between PCs (see src/Cuelight.App/SelfTest.cs):
      # the speech engine's native libraries, real speech into text, drawing the windows, hiding them
      # from screen capture. Runs the engine twice: normally, and as a CPU without AVX2 would.
      - name: Record some speech with Windows' own voice
        shell: powershell
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$PWD\selftest.wav")
          $voice.Speak('Can you start on Monday morning please')
          $voice.Dispose()

      - uses: actions/cache@v4
        with:
          path: selftest-models
          key: whisper-tiny-en-v1

      # The exe is copied alone into an empty folder and run from there, the way a downloaded file is.
      - name: Self-test
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP 'clean-folder'
          New-Item $clean -ItemType Directory | Out-Null
          Copy-Item publish\Cuelight.exe $clean
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'bundle-extract'
          # A model folder with non-English letters in its name, as a user called "José" or "Иван" would have.
          $unicode = Join-Path $env:RUNNER_TEMP ('Model-' + [string]::new([char[]](0x00C9, 0x00F1, 0x0416, 0x0434)))
          $failed = $false
          foreach ($mode in 'avx2', 'noavx') {
            $models = if ($mode -eq 'noavx') { Copy-Item selftest-models $unicode -Recurse -Force; $unicode } else { "$PWD\selftest-models" }
            $arguments = @('--self-test', '--require-vc', '--out', "$PWD\selftest-$mode", '--models', $models)
            if (Test-Path selftest.wav) { $arguments += @('--wav', "$PWD\selftest.wav", '--expect', 'monday') }
            if ($mode -eq 'noavx') { $arguments += '--noavx' }
            $p = Start-Process "$clean\Cuelight.exe" -ArgumentList $arguments -Wait -PassThru
            Write-Host "===== self-test ($mode), exit code $($p.ExitCode) ====="
            if (Test-Path "selftest-$mode\self-test.txt") { Get-Content "selftest-$mode\self-test.txt" } else { Write-Host 'no report was written' }
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          Write-Host '===== files beside the exe afterwards ====='
          Get-ChildItem $clean -Recurse -File | Format-Table Name, Length
          if (@(Get-ChildItem $clean -Recurse -File).Count -ne 1) { $failed = $true; Write-Host 'The app left extra files beside itself.' }
          if ($failed) { throw 'The self-test failed' }

      - name: Check that nothing it unpacked needs a library a clean PC lacks
        shell: pwsh
        run: |
          Write-Host 'Speech engine files:'
          Get-ChildItem "$env:LOCALAPPDATA\Cuelight\runtime" -Recurse -File | Format-Table FullName, Length
          python packaging\check-deps.py "$env:LOCALAPPDATA\Cuelight\runtime"
          python packaging\check-deps.py (Join-Path $env:RUNNER_TEMP 'bundle-extract')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test
          path: |
            selftest-avx2
            selftest-noavx
            selftest.wav

      - name: Checksum
        id: sum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish\Cuelight.exe -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          Get-Item publish\Cuelight.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Cuelight
          path: publish/Cuelight.exe

      # The release holds one file: Cuelight.exe. Its SHA-256 is in the notes.
      - name: Attach to the release
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          HASH: ${{ steps.sum.outputs.hash }}
        run: |
          @"
          **Download ``Cuelight.exe`` and double-click it.** That is the whole app: one file, nothing to install or unzip.
          Choose your AI on first launch and paste its API key; that is the only setup. It works with Claude, ChatGPT, Gemini, Grok, NVIDIA's free API catalog, or any service that speaks the OpenAI chat API.

          AI providers bill API use separately from a chat subscription (NVIDIA's API is free to try, within limits). The app starts each provider on its balanced model and shows a running cost estimate, or "Free", in its top-right corner. See "AI providers" and "What it costs" in the README.

          Windows 10 or 11, 64-bit. Windows may say "Windows protected your PC" because the app isn't code-signed yet:
          choose **More info**, then **Run anyway**. The first start unpacks the speech engine and downloads a one-time speech model (about 140 MB).

          SHA-256 of ``Cuelight.exe``: ``$($env:HASH)``

          Cuelight is an independent, unofficial project. It is not affiliated with or endorsed by Anthropic. A very large majority of it was made with Claude Code.
          "@ | Out-File notes.md -Encoding utf8
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG publish\Cuelight.exe --clobber
            gh release edit $env:TAG --notes-file notes.md
          } else {
            gh release create $env:TAG publish\Cuelight.exe --title "Cuelight $env:TAG" --notes-file notes.md --target $env:GITHUB_SHA
          }
